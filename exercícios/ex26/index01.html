<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de formulários
    </title>
</head>
<body>
    <h1>Teste de formulários</h1>
    <form action="cadrasto.php" method="post" autocomplete="on">
        <p>
            <label for="iusu">Usuário</label>
            <input type="text" name="iusu" id="iusu" required minlength="5" maxlength="15" placeholder="José de Carvalho" autocomplete="username">
        </p>
        <p>
            <label for="isen">Senha</label>
            <input type="password" name="isen" id="isen" required minlength="6" maxlength="10" placeholder="A@132?!9p" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
