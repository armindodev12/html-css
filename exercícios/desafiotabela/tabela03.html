<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            border-collapse: collapse;
            
        }
        td, th {
            border: 1px solid black;
            width: 450px;
            padding: 10px;
        }
        th, .b3, .b4 {
            background-color: gray;
            color: white;
        }
        .b1 {
            background-color: white;
            color: black;
        }
        .b2 {
            text-align: left;
        }
    </style>
</head>
<body>
    <table>
        <thead>
                <tr>
                    <th rowspan="2" scope="col">Area</th>
                    <th rowspan="2" scope="col">Disciplinas</th>
                    <th colspan="2" scope="colgroup">Notas</th>
                    <th rowspan="2" scope="col">Média</th>
                </tr>
                <tr>
                    <th>Nota 1</th>
                    <th>Nota 2</th>
                </tr>
        </thead>
        <tbody>
            <tr> <th rowspan="5" scope="rowgroup" class="b1">
                Exactas
            </th></tr>
            <tr>
                <td>Matemática</td>
                <td>5.0</td>
                <td>8.7</td>
                <td>6.2</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
                <tr>
                    <td>Química</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <td>Biologia</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <th colspan="4" scope="row" class="b2">Média de Exactas</th>
                    <td class="b3">2.0</td>
                </tr>
                <tr>
                    <th rowspan="2" scope="rowgroup" class="b1">Humanas</th>
                    <td>História</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <td>Geografia</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <th colspan="4" scope="row" class="b2">Média de Humanas</th>
                    <td class="b4">0.0</td>
                </tr>
        </tbody>
    </table>
</body>
</html>
