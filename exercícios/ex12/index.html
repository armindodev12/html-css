<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudoclasses</title>
    <style>
        div {
            display: inline-block;
            background-color: aqua;
            height: 200px;
            width: 200px;
            border: 1px solid black;
            text-align: center;
        }
        div:hover{
            background-color: chartreuse;
        }
    </style>
</head>
<body>
    <div>A1</div>
    <div>A2</div>
    <div>A3</div>
</body>
</html>
