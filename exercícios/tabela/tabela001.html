<!DOCTYPE html>
<html lang="pt'br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            width: 500px;
            border-collapse: collapse;
        }
        tr {
            border: 1px solid black;
            padding: 8px;
        }
        td {
            border: 1px solid black;
            padding: 12px;
            text-align: center;
        }
        .linha {
            background-color: gray;
        }
        .gd {
            background-color: rgb(57, 57, 177);
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr class="linha">
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td class="gd">B3</td>
            <td>C3</td>
        </tr>
    </table>
</body>
</html>
